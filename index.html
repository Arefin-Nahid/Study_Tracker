<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c6e62">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<title>BCS Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
/* Layout: gradient progress hero + colour-coded subjects. Two columns on wide screens, one column + bottom tabs on phones. */
:root{
  --bg:#eef3f8; --surface:#ffffff; --surface2:#e6edf5; --ink:#101b2b; --muted:#5a6b80; --line:#d9e2ec;
  --accent:#0f8f78; --accent-ink:#ffffff; --accent-soft:#d7f1ea;
  --due:#e0432a; --due-soft:#fde4de; --learn:#2f6df0; --learn-soft:#dde8ff; --watch:#0f8f78; --watch-soft:#d7f1ea;
  --s0:#6b7c90; --s0b:#e6edf5;
  --p1:#2f6df0; --p2:#12a15a; --p3a:#ffb21a; --p3b:#ff7a1a; --p3ink:#2a1500;
  --hero1:#0c6e62; --hero2:#2646c9;
  --sl:42%;
  --shadow:0 1px 2px rgba(16,27,43,.06),0 10px 26px rgba(16,27,43,.08);
  --head:'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
  --body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131d30; --surface2:#1b2840; --ink:#e9f0fb; --muted:#93a4bd; --line:#24344f;
  --accent:#34d1ac; --accent-ink:#04231b; --accent-soft:#0f3a33;
  --due:#ff8466; --due-soft:#3b1f1a; --learn:#7aa7ff; --learn-soft:#172b52; --watch:#34d1ac; --watch-soft:#0f3a33;
  --s0:#8da0ba; --s0b:#1b2840;
  --p1:#4b82ff; --p2:#1fb468; --hero1:#0b5b52; --hero2:#2a3fa8;
  --sl:64%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131d30; --surface2:#1b2840; --ink:#e9f0fb; --muted:#93a4bd; --line:#24344f;
  --accent:#34d1ac; --accent-ink:#04231b; --accent-soft:#0f3a33;
  --due:#ff8466; --due-soft:#3b1f1a; --learn:#7aa7ff; --learn-soft:#172b52; --watch:#34d1ac; --watch-soft:#0f3a33;
  --s0:#8da0ba; --s0b:#1b2840;
  --p1:#4b82ff; --p2:#1fb468; --hero1:#0b5b52; --hero2:#2a3fa8;
  --sl:64%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 100px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto}
header.top{max-width:760px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 12px}
.brand{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0;line-height:1.6;margin-top:3px;white-space:nowrap}
.date{font-size:13px;color:var(--muted);font-weight:500;text-align:right}
h2{font-family:var(--head);font-size:18px;margin:0 0 10px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.cols{max-width:760px;margin-inline:auto}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--head);font-weight:800;font-size:30px;line-height:1}
.ring .num small{display:block;font-family:var(--body);font-size:11px;font-weight:500;opacity:.85;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.tile{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;min-width:0}
.tile b{display:block;font-family:var(--head);font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;opacity:.9}
.mile{margin:14px 0 0;font-size:13px;opacity:.92;position:relative;z-index:1}
.week{display:flex;gap:6px;align-items:center;margin-top:10px;position:relative;z-index:1}
.week i{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal;font-size:12px}
.week i.on{background:#fff;color:#0c6e62;font-weight:800}
.week span{margin-left:auto;font-size:12px;opacity:.9}
.banner{background:var(--due-soft);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
/* next task */
.next{border:0;color:var(--ink);background:linear-gradient(160deg,var(--watch-soft),var(--surface) 70%)}
.next.rev{background:linear-gradient(160deg,var(--due-soft),var(--surface) 70%)}
.next.lrn{background:linear-gradient(160deg,var(--learn-soft),var(--surface) 70%)}
.next .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--watch);color:var(--accent-ink);margin-bottom:10px;letter-spacing:.02em}
.next.rev .tag{background:var(--due);color:#fff} .next.lrn .tag{background:var(--learn);color:#fff}
.next .what{font-size:19px;font-weight:600;line-height:1.4;margin:0 0 4px;overflow-wrap:anywhere}
.next .where{font-size:13px;color:var(--muted);margin:0 0 14px;overflow-wrap:anywhere}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--watch);border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 12px rgba(15,143,120,.3)}
.next.rev .btn.primary{background:var(--due);color:#fff;box-shadow:0 4px 12px rgba(224,67,42,.3)}
.next.lrn .btn.primary{background:var(--learn);color:#fff;box-shadow:0 4px 12px rgba(47,109,240,.3)}
.btn.warn{color:var(--due)}
.focus{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:14px}
.focus select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;max-width:100%;min-width:0}
/* due */
.due-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.due-item:first-of-type{border-top:0}
.due-item p{margin:0;overflow-wrap:anywhere;min-width:0}
.due-item small{color:var(--muted);display:block;font-size:12px}
.pill-due{font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--due);color:#fff;white-space:nowrap}
/* subjects */
.subj{--c:hsl(var(--h) 70% var(--sl));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:left}
.subj:first-of-type{border-top:0}
.subj b{font-weight:600;overflow-wrap:anywhere}
.subj b::before,.chip i{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.subj em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.subj .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
/* syllabus */
.syl{max-width:760px;margin-inline:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.chips::-webkit-scrollbar{display:none}
.chip{--c:hsl(var(--h,160) 70% var(--sl));flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center}
.chip i{margin-right:7px}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:transparent;font-weight:600}
.chip[aria-pressed="true"] i{background:#fff}
.chip.all[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lec{--c:hsl(var(--h) 70% var(--sl));background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.lec-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch}
.lec-head{border:0;background:none;text-align:left;padding:13px 8px 13px 15px;min-width:0;display:grid;gap:7px}
.lec-head b{font-weight:600;overflow-wrap:anywhere}
.lec-head b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.lec-head .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.lec-head .bar{margin:0;height:6px;flex:1}
.watch{border:0;border-left:1px solid var(--line);background:none;padding:0 14px;min-width:88px;font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center;gap:3px}
.watch .box{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:transparent}
.watch[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.watch[aria-pressed="true"] .box{background:var(--watch);border-color:var(--watch);color:var(--accent-ink)}
.topics{border-top:1px solid var(--line);padding:4px 15px 10px}
.t{padding:11px 0;border-top:1px solid var(--line)}
.t:first-child{border-top:0}
.t-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.t-main p{margin:0;overflow-wrap:anywhere;min-width:0}
.tag2{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-right:6px}
.st{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.st0{background:var(--s0b);color:var(--s0)}
.st1{background:var(--p1);color:#fff}
.st2{background:var(--p2);color:#fff}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px;font-size:12px;font-weight:600;display:grid;gap:0;justify-items:center;line-height:1.25}
.pick button b{font-size:18px}
.pick .p0[aria-pressed="true"]{background:var(--s0b);border-color:var(--s0)}
.pick .p1[aria-pressed="true"]{background:var(--p1);border-color:var(--p1);color:#fff}
.pick .p2[aria-pressed="true"]{background:var(--p2);border-color:var(--p2);color:#fff}
.rv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs button{flex:1;max-width:240px;border:0;background:none;border-radius:14px;padding:8px;font-weight:600;color:var(--muted);display:grid;gap:0;justify-items:center;font-size:13px}
nav.tabs button b{font-size:18px;line-height:1.1}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.empty{color:var(--muted);padding:6px 0;margin:0}
@media (max-width:420px){.hero-grid{grid-template-columns:1fr;justify-items:center}.tiles{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hello h1{font-family:var(--head);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.15;margin:0}
.hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hello{padding-block:2px 16px;max-width:760px;margin-inline:auto}
h2.plain{margin:6px 2px 10px}
:root{--due-c:#e0432a;--learn-c:#2f6df0;--watch-c:#0f8f78}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--due-c:#ff8466;--learn-c:#7aa7ff;--watch-c:#34d1ac}}
:root[data-theme="dark"]{--due-c:#ff8466;--learn-c:#7aa7ff;--watch-c:#34d1ac}
.next{border-radius:28px;padding:0;background:linear-gradient(135deg,#0c6e62,#1a8f7a);color:#fff;box-shadow:0 18px 40px -18px rgba(12,110,98,.7);overflow:hidden;position:relative}
.next.rev{background:linear-gradient(135deg,#0c6e62,#1a8f7a);box-shadow:0 18px 40px -18px rgba(12,110,98,.7)}
.next.lrn{background:linear-gradient(135deg,#0c6e62,#1a8f7a);box-shadow:0 18px 40px -18px rgba(12,110,98,.7)}
.next::after{content:"";position:absolute;right:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.next-in{padding:22px;position:relative;z-index:1}
.next .tag,.next.rev .tag,.next.lrn .tag{background:rgba(255,255,255,.2);color:#fff;font-size:11px;letter-spacing:.08em}
.next .what{font-size:22px;line-height:1.35;font-weight:700;margin:2px 0 6px;color:#fff}
.next .where{color:rgba(255,255,255,.85);margin-bottom:18px}
.next .btn.primary,.next.rev .btn.primary,.next.lrn .btn.primary{background:#fff;color:#0f2a26;box-shadow:0 6px 16px rgba(0,0,0,.18);padding:12px 20px;border-radius:14px}
.next .btn.ghost{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;padding:12px 18px;border-radius:14px}
.next .focus{color:rgba(255,255,255,.85);margin-top:18px}
.next .focus select{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.next .focus select option{color:#111}
.plan{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface2)}
.pl .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.pl.done .ck{background:var(--c)}
.pl b{display:block;font-weight:600}
.pl small{color:var(--muted);font-size:12px}
.pl .sr{font-size:12px;font-weight:700;color:var(--c)}
.pl.done b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.prog-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.prog .ring{color:var(--ink)}
.prog .ring .num small{opacity:1;color:var(--muted)}
.prog .ring circle:first-child{stroke:var(--surface2)}
.prog .ring circle:last-child{stroke:var(--accent)}
.prog .tile{background:var(--surface2);color:var(--ink)}
.prog .tile i{font-style:normal;font-size:12px;font-weight:500;color:var(--muted)}
.prog .tile span{color:var(--muted);opacity:1}
.prog .mile{color:var(--muted);opacity:1;margin:14px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wd{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.wd i{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.wd.on i{background:var(--accent);color:var(--accent-ink)}
.wd.now i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sc{--c:hsl(var(--h) 70% var(--sl));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;display:grid;gap:10px;box-shadow:var(--shadow)}
.sc .mr{position:relative;width:46px;height:46px;display:block}
.sc .mr svg{width:46px;height:46px}
.sc .mr b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}
.sc .sn{display:grid;gap:0;min-width:0}
.sc .sn b{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.sc .sn em{font-style:normal;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.sc .sn small{font-size:11px;color:var(--muted);margin-top:4px}
.card{border-radius:24px}
.btn.ghost{background:transparent}
@media (max-width:420px){.prog-top{grid-template-columns:1fr;justify-items:center}.prog .tiles{width:100%}}

.icon{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:38px;height:38px;font-size:22px;line-height:1;display:grid;place-items:center}
.icon.sm{width:30px;height:30px;font-size:18px;border-radius:10px}
.wk-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wk-head>div{flex:1;text-align:center;min-width:0}
.wk-head b{font-family:var(--head);font-size:18px;display:block}
.wk-head small{color:var(--muted);font-size:12px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.dp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 2px;display:grid;justify-items:center;gap:1px;text-align:center}
.dp span{font-size:11px;color:var(--muted);font-weight:600}
.dp b{font-family:var(--head);font-size:18px}
.dp em{font-style:normal;min-height:14px;font-size:10px;font-weight:700;color:var(--due-c);display:flex;gap:3px;align-items:center}
.dp em i{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 70% var(--sl))}
.dp.now{background:var(--accent);border-color:transparent}
.dp.now span,.dp.now b,.dp.now em{color:var(--accent-ink)}
.dp.sat{border-color:var(--due-c)}
.slots{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);margin-bottom:14px}
@media (min-width:640px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{border-radius:22px;padding:14px;text-align:left}
.empty-slot{border:2px dashed var(--line);background:transparent;display:grid;place-items:center;gap:2px;min-height:130px;color:var(--muted);font-weight:600}
.empty-slot b{font-size:30px;line-height:1;color:var(--accent)}

    h+=`<article class="lec" style="--h:${hue(l.f)}"><div class="lec-top"><button class="lec-head" data-a="toggle" data-lid="${l.i}" aria-expanded="${isOpen}"><b>${esc(l.l)}</b><span class="meta">${filt==='all'&&(l.f==='WLV'||l.f==='REC')?esc(l.sn)+' · ':''}${st.l1}/${st.un} learned${barHtml(p)}</span></button>

    if(isOpen){const k=q.toLowerCase();const us=l.u.filter(u=>!q||l.l.toLowerCase().includes(k)||u[3].toLowerCase().includes(k));h+='<div class="topics">'+us.map(topicHtml).join('')+'</div>'}
    h+='</article>'});
  $('#list').innerHTML=h}
function render(){
  $('#tabToday').setAttribute('aria-current',tab==='today'?'page':'false');
  $('#tabSyl').setAttribute('aria-current',tab==='syl'?'page':'false');
  $('#tabWeek').setAttribute('aria-current',tab==='week'?'page':'false');
  const v=$('#view');
  if(tab==='today'){v.innerHTML=renderToday()}
  else if(tab==='week'){v.innerHTML=renderWeek()}
  else{if(!$('#list')){v.innerHTML=renderSyl()}else{document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===filt)));document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.v==='1')===onlyOpen)))}renderList()}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='gweek'){wkOff=0;goTab('week');return}
  if(a==='wkprev'){wkOff--;render();return}
  if(a==='wknext'){wkOff++;render();return}
  if(a==='wknow'){wkOff=0;render();return}
  if(a==='wkadd'){openSheet(+b.dataset.i);return}
  if(a==='sheetclose'){closeSheet();return}
  if(a==='sheetf'){sheetF=b.dataset.k;renderSheet();return}
  if(a==='wkpick'){const k=curWeek(),w=getWk(k);w.s[sheetSlot]={l:b.dataset.lid,d:-1,e:0,sc:''};closeSheet();putWk(k,w);return}
  if(a==='wkdel'){const k=curWeek(),w=getWk(k),i=+b.dataset.i;if(i>=4)w.s.splice(i,1);else w.s[i]=null;putWk(k,w);return}
  if(a==='wkmore'){const k=curWeek(),w=getWk(k);w.s.push(null);putWk(k,w);openSheet(w.s.length-1);return}
  if(a==='wkxmore'){const k=curWeek(),w=getWk(k);w.xs.push({e:0,sc:'',d:6});putWk(k,w);return}
  if(a==='wkxdel'){const k=curWeek(),w=getWk(k);w.xs.splice(+b.dataset.i,1);putWk(k,w);return}
  if(a==='wkexam'){const k=curWeek(),w=getWk(k),sl=w.s[+b.dataset.i];sl.e=sl.e?0:1;putWk(k,w);return}
  if(a==='wkx'){const k=curWeek(),w=getWk(k),x=w.xs[+b.dataset.i];x.e=x.e?0:1;putWk(k,w);return}
  if(a==='wkopen'){const l=LECBY[b.dataset.lid];open.add(l.i);filt=l.f;q='';onlyOpen=false;goTab('syl',()=>{const el=document.querySelector(`[data-lid="${l.i}"][data-a="toggle"]`);if(el)el.scrollIntoView({block:'center'})});return}
  if(a==='rev')reviewed(b.dataset.id);
  else if(a==='forgot')forgot(b.dataset.id);
  else if(a==='stage'){const id=b.dataset.id;pick=null;setStage(id,+b.dataset.st)}
  else if(a==='watch')toggleWatch(b.dataset.lid);
  else if(a==='moredue'){showAllDue=!showAllDue;render()}
  else if(a==='subj'){filt=b.dataset.k;q='';goTab('syl')}
  else if(a==='open'){const lid=b.dataset.lid;open.add(lid);const l=LEC.find(x=>x.i===lid);filt=l.f;q='';onlyOpen=false;goTab('syl',()=>{const el=document.querySelector(`[data-lid="${lid}"][data-a="toggle"]`);if(el)el.scrollIntoView({block:'center'})})}
  else if(a==='toggle'){const id=b.dataset.lid;open.has(id)?open.delete(id):open.add(id);pick=null;render()}
  else if(a==='pick'){pick=pick===b.dataset.id?null:b.dataset.id;render()}
  else if(a==='filt'){filt=b.dataset.k;pick=null;render();window.scrollTo({top:0})}
  else if(a==='only'){onlyOpen=b.dataset.v==='1';render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim();renderList()}if(e.target.id==='sheetQ'){sheetQ=e.target.value.trim();renderSheet()}});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='focus'){focus=t.value;render();return}
  const a=t.dataset.a2;if(!a)return;const k=curWeek(),w=getWk(k);
  if(a==='wkday'){w.s[+t.dataset.i].d=+t.value;putWk(k,w)}
  else if(a==='wksc'){w.s[+t.dataset.i].sc=t.value===''?'':Math.max(0,Math.min(100,+t.value));putWk(k,w)}
  else if(a==='wkxsc'){w.xs[+t.dataset.i].sc=t.value===''?'':Math.max(0,Math.min(100,+t.value));putWk(k,w)}
  else if(a==='wkxday'){w.xs[+t.dataset.i].d=+t.value;putWk(k,w)}
});
function goTab(t,cb){tab=t;pick=null;render();if(cb)cb();else window.scrollTo({top:0})}
$('#tabToday').onclick=()=>goTab('today');
$('#tabSyl').onclick=()=>goTab('syl');
$('#tabWeek').onclick=()=>goTab('week');
$('#date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});

window.__bcs={t:()=>S.t,remote:r=>{const b=S.t;adopt(r);if(S.t!==b){try{localStorage.setItem(KEY,JSON.stringify({v:3,...S}))}catch(e){}render()}},push:()=>{dirty=true;flush()},setRef:r=>{ref=r}};
const loc=loadLocal();if(loc)adopt(loc);
render();
initStore();
</script>
<script type="module">
// Firebase sync: Google sign-in + one Firestore document per user (users/<uid>).
const btn=document.getElementById('acct');
let cfg=null;
try{cfg=(await import('./firebase-config.js')).firebaseConfig}catch(e){}
if(cfg&&cfg.apiKey&&!String(cfg.apiKey).startsWith('PASTE')){
  const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
  try{
    const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=initializeApp(cfg),auth=A.getAuth(app);
    const db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()});
    let unsub=null;
    const paint=(user,off)=>{
      btn.hidden=false;btn.classList.toggle('off',!!off);
      btn.innerHTML=user?`<span class="av">${(user.displayName||user.email||'?').trim()[0].toUpperCase()}</span><span class="st"></span>`:'Sign in';
      btn.title=user?(off?'Offline, will sync later. Tap to sign out.':'Synced as '+(user.email||'')+'. Tap to sign out.'):'Sign in with Google to sync';
    };
    btn.onclick=async()=>{
      if(auth.currentUser){if(confirm('Sign out? Your progress stays saved in the cloud.'))A.signOut(auth);return}
      const p=new A.GoogleAuthProvider();
      try{await A.signInWithPopup(auth,p)}catch(e){
        if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))A.signInWithRedirect(auth,p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('Sign-in failed: '+(e.code||e.message))}
    };
    A.onAuthStateChanged(auth,user=>{
      if(unsub){unsub();unsub=null}
      window.__bcs.setRef(null);paint(user,false);
      if(!user)return;
      const ref=F.doc(db,'users',user.uid);
      window.__bcs.setRef({set:d=>F.setDoc(ref,d)});
      unsub=F.onSnapshot(ref,snap=>{
        paint(user,snap.metadata.fromCache&&!snap.metadata.hasPendingWrites&&!navigator.onLine);
        if(snap.metadata.hasPendingWrites)return;
        const mine=window.__bcs.t();
        if(snap.exists()){const r=snap.data();if((r.t||0)>mine)window.__bcs.remote(r);else if((r.t||0)<mine)window.__bcs.push()}
        else if(mine)window.__bcs.push();
      },()=>paint(user,true));
    });
    addEventListener('online',()=>auth.currentUser&&paint(auth.currentUser,false));
    addEventListener('offline',()=>auth.currentUser&&paint(auth.currentUser,true));
  }catch(e){console.warn('Sync unavailable',e)}
}

</script>
