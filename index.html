    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0c6e62" />
                <stop offset="1" stop-color="#22b58f" />
              </linearGradient>
            </defs>
            <rect width="40" height="40" rx="11" fill="url(#lg)" />
            <path d="M9.5 12.5c3.6-1.5 7.2-1.4 10.5 1v14.5c-3.3-2.3-6.9-2.4-10.5-.9z" fill="#fff" />
            <path
              d="M30.5 12.5c-3.6-1.5-7.2-1.4-10.5 1v14.5c3.3-2.3 6.9-2.4 10.5-.9z"
              fill="#fff"
              fill-opacity=".72"
            />
            <path
              d="M14 20.5l2.4 2.4 4.4-5"
              fill="none"
              stroke="#0c6e62"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <div class="bt"><span>Study Tracker</span><small id="tagline"></small></div>
        </div>
        <div class="hr">
          <div class="date" id="date"></div>
          <button id="acct" class="acct" type="button" hidden></button>
        </div>
      </header>
      <main id="view"></main>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button id="tabToday" aria-current="page"><b>◉</b>Today</button>
      <button id="tabWeek"><b>▦</b>Week</button>
      <button id="tabPlan"><b>◷</b>Planner</button>
      <button id="tabSyl"><b>☰</b>Syllabus</button>
    </nav>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-bg" data-a="sheetclose"></div>
      <div class="sheet-card" role="dialog" aria-label="Pick a lecture">
        <div class="sheet-h">
          <b id="sheetTitle">Pick a lecture</b><button class="btn" data-a="sheetclose">Close</button>
        </div>
        <div class="chips2" id="sheetChips"></div>
        <input type="search" id="sheetQ" placeholder="Search lectures" aria-label="Search lectures" />
        <div id="sheetList"></div>
      </div>
    </div>
    <div class="sheet" id="psheet" hidden>
      <div class="sheet-bg" data-pa="close"></div>
      <div class="sheet-card" id="pcard" role="dialog" aria-label="Planner"></div>
    </div>
    <div class="toast" id="toast" hidden role="status"></div>

    <script src="data.js?v=1"></script>
    <script src="app.js?v=1"></script>
    <script src="planner.js?v=1"></script>
    <script src="ai.js?v=1"></script>
    <script src="boot.js?v=1"></script>
    <script>
      if ("serviceWorker" in navigator)
        addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    </script>
    <script src="firebase-config.js"></script>
    <script type="module" src="sync.js?v=1"></script>
  </body>
</html>
