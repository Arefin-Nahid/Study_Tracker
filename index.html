<style>
/* Layout: gradient progress hero + colour-coded subjects. Two columns on wide screens, one column + bottom tabs on phones. */
:root{
  --bg:#eef3f8; --surface:#ffffff; --surface2:#e6edf5; --ink:#101b2b; --muted:#5a6b80; --line:#d9e2ec;
  --accent:#0f8f78; --accent-ink:#ffffff; --accent-soft:#d7f1ea;
  --due:#e0432a; --due-soft:#fde4de; --learn:#2f6df0; --learn-soft:#dde8ff; --watch:#0f8f78; --watch-soft:#d7f1ea;
  --s0:#6b7c90; --s0b:#e6edf5;
  --p1:#2f6df0; --p2:#12a15a; --p3a:#ffb21a; --p3b:#ff7a1a; --p3ink:#2a1500;
  --hero1:#0c6e62; --hero2:#2646c9;
  --sl:42%;
  --shadow:0 1px 2px rgba(16,27,43,.06),0 10px 26px rgba(16,27,43,.08);
  --head:'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
  --body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131d30; --surface2:#1b2840; --ink:#e9f0fb; --muted:#93a4bd; --line:#24344f;
  --accent:#34d1ac; --accent-ink:#04231b; --accent-soft:#0f3a33;
  --due:#ff8466; --due-soft:#3b1f1a; --learn:#7aa7ff; --learn-soft:#172b52; --watch:#34d1ac; --watch-soft:#0f3a33;
  --s0:#8da0ba; --s0b:#1b2840;
  --p1:#4b82ff; --p2:#1fb468; --hero1:#0b5b52; --hero2:#2a3fa8;
  --sl:64%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131d30; --surface2:#1b2840; --ink:#e9f0fb; --muted:#93a4bd; --line:#24344f;
  --accent:#34d1ac; --accent-ink:#04231b; --accent-soft:#0f3a33;
  --due:#ff8466; --due-soft:#3b1f1a; --learn:#7aa7ff; --learn-soft:#172b52; --watch:#34d1ac; --watch-soft:#0f3a33;
  --s0:#8da0ba; --s0b:#1b2840;
  --p1:#4b82ff; --p2:#1fb468; --hero1:#0b5b52; --hero2:#2a3fa8;
  --sl:64%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 100px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto}
header.top{max-width:760px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 12px}
.brand{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0;line-height:1.6;margin-top:3px;white-space:normal;max-width:240px}
.date{font-size:13px;color:var(--muted);font-weight:500;text-align:right}
h2{font-family:var(--head);font-size:18px;margin:0 0 10px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.cols{max-width:760px;margin-inline:auto}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--head);font-weight:800;font-size:30px;line-height:1}
.ring .num small{display:block;font-family:var(--body);font-size:11px;font-weight:500;opacity:.85;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.tile{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;min-width:0}
.tile b{display:block;font-family:var(--head);font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;opacity:.9}
.mile{margin:14px 0 0;font-size:13px;opacity:.92;position:relative;z-index:1}
.week{display:flex;gap:6px;align-items:center;margin-top:10px;position:relative;z-index:1}
.week i{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal;font-size:12px}
.week i.on{background:#fff;color:#0c6e62;font-weight:800}
.week span{margin-left:auto;font-size:12px;opacity:.9}
.banner{background:var(--due-soft);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
/* next task */
.next{border:0;color:var(--ink);background:linear-gradient(160deg,var(--watch-soft),var(--surface) 70%)}
.next.rev{background:linear-gradient(160deg,var(--due-soft),var(--surface) 70%)}
.next.lrn{background:linear-gradient(160deg,var(--learn-soft),var(--surface) 70%)}
.next .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--watch);color:var(--accent-ink);margin-bottom:10px;letter-spacing:.02em}
.next.rev .tag{background:var(--due);color:#fff} .next.lrn .tag{background:var(--learn);color:#fff}
.next .what{font-size:19px;font-weight:600;line-height:1.4;margin:0 0 4px;overflow-wrap:anywhere}
.next .where{font-size:13px;color:var(--muted);margin:0 0 14px;overflow-wrap:anywhere}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--watch);border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 12px rgba(15,143,120,.3)}
.next.rev .btn.primary{background:var(--due);color:#fff;box-shadow:0 4px 12px rgba(224,67,42,.3)}
.next.lrn .btn.primary{background:var(--learn);color:#fff;box-shadow:0 4px 12px rgba(47,109,240,.3)}
.btn.warn{color:var(--due)}
.focus{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:14px}
.focus select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;max-width:100%;min-width:0}
/* due */
.due-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.due-item:first-of-type{border-top:0}
.due-item p{margin:0;overflow-wrap:anywhere;min-width:0}
.due-item small{color:var(--muted);display:block;font-size:12px}
.pill-due{font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--due);color:#fff;white-space:nowrap}
/* subjects */
.subj{--c:hsl(var(--h) 70% var(--sl));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:left}
.subj:first-of-type{border-top:0}
.subj b{font-weight:600;overflow-wrap:anywhere}
.subj b::before,.chip i{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.subj em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.subj .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
/* syllabus */
.syl{max-width:760px;margin-inline:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.chips::-webkit-scrollbar{display:none}
.chip{--c:hsl(var(--h,160) 70% var(--sl));flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center}
.chip i{margin-right:7px}
.chip[aria-pressed="true"]{background:var(--c);color:#fff;border-color:transparent;font-weight:600}
.chip[aria-pressed="true"] i{background:#fff}
.chip.all[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lec{--c:hsl(var(--h) 70% var(--sl));background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.lec-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch}
.lec-head{border:0;background:none;text-align:left;padding:13px 8px 13px 15px;min-width:0;display:grid;gap:7px}
.lec-head b{font-weight:600;overflow-wrap:anywhere}
.lec-head b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.lec-head .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.lec-head .bar{margin:0;height:6px;flex:1}
.lec-act{display:flex}
.lec-act .watch{min-width:78px;padding:0 8px;text-align:center;line-height:1.25}
.watch.pex[aria-pressed="true"]{color:#7c3aed;background:rgba(124,58,237,.1)}
.watch.pex[aria-pressed="true"] .box{background:#7c3aed;border-color:#7c3aed;color:#fff}
@media (max-width:380px){.lec-act .watch{min-width:64px;font-size:11px}}
.watch{border:0;border-left:1px solid var(--line);background:none;padding:0 14px;min-width:88px;font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center;gap:3px}
.watch .box{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:transparent}
.watch[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.watch[aria-pressed="true"] .box{background:var(--watch);border-color:var(--watch);color:var(--accent-ink)}
.topics{border-top:1px solid var(--line);padding:4px 15px 10px}
.t{padding:11px 0;border-top:1px solid var(--line)}
.t:first-child{border-top:0}
.t-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.t-main p{margin:0;overflow-wrap:anywhere;min-width:0}
.tag2{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-right:6px}
.st{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.st0{background:var(--s0b);color:var(--s0)}
.st1{background:var(--p1);color:#fff}
.st2{background:var(--p2);color:#fff}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px;font-size:12px;font-weight:600;display:grid;gap:0;justify-items:center;line-height:1.25}
.pick button b{font-size:18px}
.pick .p0[aria-pressed="true"]{background:var(--s0b);border-color:var(--s0)}
.pick .p1[aria-pressed="true"]{background:var(--p1);border-color:var(--p1);color:#fff}
.pick .p2[aria-pressed="true"]{background:var(--p2);border-color:var(--p2);color:#fff}
.rv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs button{flex:1;max-width:240px;border:0;background:none;border-radius:14px;padding:8px;font-weight:600;color:var(--muted);display:grid;gap:0;justify-items:center;font-size:13px}
nav.tabs button b{font-size:18px;line-height:1.1}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.empty{color:var(--muted);padding:6px 0;margin:0}
@media (max-width:420px){.hero-grid{grid-template-columns:1fr;justify-items:center}.tiles{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hello h1{font-family:var(--head);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.15;margin:0}
.hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hello{padding-block:2px 16px;max-width:760px;margin-inline:auto}
h2.plain{margin:6px 2px 10px}
:root{--due-c:#e0432a;--learn-c:#2f6df0;--watch-c:#0f8f78}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--due-c:#ff8466;--learn-c:#7aa7ff;--watch-c:#34d1ac}}
:root[data-theme="dark"]{--due-c:#ff8466;--learn-c:#7aa7ff;--watch-c:#34d1ac}
.next{border-radius:28px;padding:0;background:linear-gradient(135deg,#0c6e62,#1a8f7a);color:#fff;box-shadow:0 18px 40px -18px rgba(12,110,98,.7);overflow:hidden;position:relative}
.next.rev{background:linear-gradient(135deg,#0c6e62,#1a8f7a);box-shadow:0 18px 40px -18px rgba(12,110,98,.7)}
.next.lrn{background:linear-gradient(135deg,#0c6e62,#1a8f7a);box-shadow:0 18px 40px -18px rgba(12,110,98,.7)}
.next::after{content:"";position:absolute;right:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.next-in{padding:22px;position:relative;z-index:1}
.next .tag,.next.rev .tag,.next.lrn .tag{background:rgba(255,255,255,.2);color:#fff;font-size:11px;letter-spacing:.08em}
.next .what{font-size:22px;line-height:1.35;font-weight:700;margin:2px 0 6px;color:#fff}
.next .where{color:rgba(255,255,255,.85);margin-bottom:18px}
.next .btn.primary,.next.rev .btn.primary,.next.lrn .btn.primary{background:#fff;color:#0f2a26;box-shadow:0 6px 16px rgba(0,0,0,.18);padding:12px 20px;border-radius:14px}
.next .btn.ghost{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;padding:12px 18px;border-radius:14px}
.next .focus{color:rgba(255,255,255,.85);margin-top:18px}
.next .focus select{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.next .focus select option{color:#111}
.plan{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface2)}
.pl .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.pl.done .ck{background:var(--c)}
.pl b{display:block;font-weight:600}
.pl small{color:var(--muted);font-size:12px}
.pl .sr{font-size:12px;font-weight:700;color:var(--c)}
.pl.done b{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.prog-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.prog .ring{color:var(--ink)}
.prog .ring .num small{opacity:1;color:var(--muted)}
.prog .ring circle:first-child{stroke:var(--surface2)}
.prog .ring circle:last-child{stroke:var(--accent)}
.prog .tile{background:var(--surface2);color:var(--ink)}
.prog .tile i{font-style:normal;font-size:12px;font-weight:500;color:var(--muted)}
.prog .tile span{color:var(--muted);opacity:1}
.prog .mile{color:var(--muted);opacity:1;margin:14px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wd{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.wd i{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.wd.on i{background:var(--accent);color:var(--accent-ink)}
.wd.now i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sc{--c:hsl(var(--h) 70% var(--sl));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;display:grid;gap:10px;box-shadow:var(--shadow)}
.sc .mr{position:relative;width:46px;height:46px;display:block}
.sc .mr svg{width:46px;height:46px}
.sc .mr b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}

    if(isOpen){const k=q.toLowerCase();const us=l.u.filter(u=>!q||l.l.toLowerCase().includes(k)||u[3].toLowerCase().includes(k));h+='<div class="topics">'+us.map(topicHtml).join('')+'</div>'}
    h+='</article>'});
  $('#list').innerHTML=h}

/* ===== Planner: daily time-blocking + 5 prayers ===== */
const PRAY=['fajr','dhuhr','asr','maghrib','isha'];
const PNAME={fajr:'Fajr',dhuhr:'Dhuhr',asr:'Asr',maghrib:'Maghrib',isha:'Isha'};
const PDUR={fajr:25,dhuhr:20,asr:20,maghrib:20,isha:20};
const PDEF={fajr:275,dhuhr:710,asr:910,maghrib:1060,isha:1140};
const BT={class:{n:'Class lecture',h:200},vocab:{n:'Vocabulary',h:45},study:{n:'Deep study',h:215},revise:{n:'Revision',h:28},practice:{n:'Practice',h:150},exam:{n:'Exam',h:268},write:{n:'Writing',h:185},news:{n:'Newspaper',h:330},meal:{n:'Meal',h:0},break:{n:'Break',h:0},other:{n:'Other',h:0}};
const WORK=['class','study','revise','practice','exam','write','news','vocab'];
let pDate=today(), pEdit=null;
const getCfg=()=>{const c=S.c||{};return {pt:Object.assign({},PDEF,c.pt||{}),goal:c.goal||(c.ap&&c.ap.goal)||10}};
const getDay=d=>{const x=(S.p||{})[d]||{};return {b:(x.b||[]).slice(),pr:Object.assign({},x.pr||{})}};
function putDay(d,x){if(!S.p)S.p={};if(!x.b.length&&!Object.keys(x.pr).length)delete S.p[d];else S.p[d]=x;commit();render()}
const T12=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return ((h%12)||12)+':'+String(mm).padStart(2,'0')+(h<12?' AM':' PM')};
const T24=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const P24=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
const DUR=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m';
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function planItems(date){const cfg=getCfg(),d=getDay(date);
  const it=d.b.map(x=>({k:'b',id:x.id,t:x.t,n:x.n,s:x.s,d:x.d,x:x.x}));
  PRAY.forEach(n=>it.push({k:'p',id:n,n:PNAME[n],t:'prayer',s:cfg.pt[n],d:PDUR[n],x:d.pr[n]}));
  return it.sort((a,b)=>a.s-b.s||(a.k==='p'?-1:1))}

function plannedMins(items,onlyDone){return items.filter(x=>x.k==='b'&&WORK.includes(x.t)&&(!onlyDone||x.x)).reduce((a,x)=>a+x.d,0)}

function insights(items,date){
  const cfg=getCfg(),pl=plannedMins(items),out=[],nDue=dueList().length;
  const blocks=items.filter(x=>x.k==='b');
  if(!blocks.length)return [{c:'info',t:'No blocks yet. Use + Add block, or tap a type above, to build your day.'}];
  if(pl<cfg.goal*60-30)out.push({c:'warn',t:`Planned study is ${DUR(cfg.goal*60-pl)} below your ${cfg.goal}h target.`});
  if(nDue&&!blocks.some(x=>x.t==='revise'))out.push({c:'warn',t:`${nDue} topic${nDue>1?'s':''} due for revision but no revision block. Do revision first; it is the cheapest gain.`});
  if(!blocks.some(x=>x.t==='exam'||x.t==='practice'))out.push({c:'warn',t:'No practice or mock exam. Timed recall beats re-reading for retention.'});
  if(!blocks.some(x=>x.t==='news'||x.t==='vocab'))out.push({c:'warn',t:'No newspaper or vocabulary block. 20 to 45 minutes daily compounds for the English, general knowledge and current affairs sections.'});
  const wk=plannedMins(items),rc=blocks.filter(x=>RECALL.includes(x.t)).reduce((a,x)=>a+x.d,0);
  if(wk&&rc/wk<0.35)out.push({c:'warn',t:`Only ${Math.round(rc/wk*100)}% of study time is active recall. Add practice questions or a timed test; recall builds memory faster than re-reading.`});
  const long=blocks.find(x=>WORK.includes(x.t)&&x.d>120);
  if(long)out.push({c:'warn',t:`"${long.n||BT[long.t].n}" runs ${DUR(long.d)}. Focus drops after about 90 minutes; split it with a 10 to 15 minute break.`});
  const last=Math.max(...blocks.map(x=>x.s+x.d));
  if(last>23*60)out.push({c:'warn',t:'Plan runs past 11 PM. Protect 7 hours of sleep; it consolidates what you studied.'});
  if(!out.length)out.push({c:'ok',t:'Balanced plan. Protect your first deep-study block and do the hardest topic there.'});
  return out}

const DDUR={class:120,study:60,revise:45,practice:60,exam:60,news:45,vocab:20,other:30};
const TIPS={class:'Take active notes and pause to summarise every 20 minutes. Review them within 24 hours.',study:'One topic only, phone away. Do your hardest subject first, when attention is highest.',revise:'Recall from memory first, then check. Revise topics due today before new ones.',practice:'Mixed-topic questions. Log every mistake and its cause.',exam:'Timed, in exam conditions. Review each wrong answer afterwards.',news:'Read for facts likely to be asked. Note 5 to 8 key points.',vocab:'Learn 10 to 15 new words with meanings and a sentence. Review yesterday\'s words first.',other:'Anything else: writing, travel, rest, errands.'};
const QUICK=['class','study','revise','practice','exam','news','vocab'];
function nextStart(date){
  const b=getDay(date).b;let t=b.length?Math.max(...b.map(x=>x.s+x.d)):(date===today()?Math.max(8*60,Math.ceil(nowMin()/5)*5):8*60);
  t=Math.ceil(t/5)*5;const cfg=getCfg();
  for(let k=0;k<5;k++)for(const n of PRAY){const ps=cfg.pt[n],pe=ps+PDUR[n];if(t<pe&&t+30>ps)t=pe}
  return Math.min(t,23*60+30)}
const TECH={study:'Deep work, one topic',revise:'Spaced repetition',practice:'Interleaved practice',exam:'Timed retrieval test',write:'Output practice',news:'Current affairs, brief notes',class:'Active note-taking',vocab:'Spaced word review',meal:'Recovery',break:'Recovery',other:'Review'};
const RECALL=['practice','exam','revise'];
let showFree=true;try{showFree=localStorage.getItem('st-free')!=='0'}catch(e){}
let FT=null;try{FT=JSON.parse(localStorage.getItem('st-focus')||'null')}catch(e){}
const saveFT=()=>{try{FT?localStorage.setItem('st-focus',JSON.stringify(FT)):localStorage.removeItem('st-focus')}catch(e){}};
const ftLeft=()=>FT?(FT.paused?FT.left:Math.max(0,FT.end-Date.now())):0;
const mmss=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=n=>String(n).padStart(2,'0');return (h?h+':':'')+z(m)+':'+z(s%60)};
setInterval(()=>{if(!FT)return;if(!FT.paused&&ftLeft()<=0){finishFocus(true);return}
  const el=document.getElementById('ftTime');if(el)el.textContent=mmss(ftLeft());
  const bar=document.getElementById('ftBar');if(bar)bar.style.width=Math.min(100,100-ftLeft()/FT.total*100)+'%'},1000);
function startFocus(date,id){const d=getDay(date),b=d.b.find(x=>x.id===id);if(!b)return;
  if(FT&&!confirm('Replace the running focus session?'))return;
  FT={date,id,total:b.d*60000,end:Date.now()+b.d*60000,paused:0,left:0,n:b.n||BT[b.t].n};saveFT();render()}
function finishFocus(auto){if(!FT)return;const f=FT;FT=null;saveFT();
  const d=getDay(f.date),b=d.b.find(x=>x.id===f.id);
  if(b&&!b.x){b.x=1;putDay(f.date,d)}else render();
  toast(auto?'Focus session complete. Block marked done.':'Block marked done.')}

function mixHtml(items){
  const by={};items.filter(x=>x.k==='b').forEach(x=>by[x.t]=(by[x.t]||0)+x.d);
  const tot=Object.values(by).reduce((a,b)=>a+b,0);if(!tot)return '';
  const keys=Object.keys(BT).filter(k=>by[k]);
  const work=WORK.reduce((a,k)=>a+(by[k]||0),0),rec=RECALL.reduce((a,k)=>a+(by[k]||0),0);
  const share=work?Math.round(rec/work*100):0;
  return `<section class="card mix"><div class="mixbar" role="img" aria-label="Time by type">${keys.map(k=>`<i style="flex:${by[k]};--h:${BT[k].h}" class="${['meal','break','other'].includes(k)?'neu':''}"></i>`).join('')}</div>
  <div class="mixleg">${keys.map(k=>`<span class="${['meal','break','other'].includes(k)?'neu':''}" style="--h:${BT[k].h}"><i></i>${BT[k].n} <b>${DUR(by[k])}</b></span>`).join('')}</div>
  <p class="mixnote">Active recall <b>${share}%</b> of study time <span>(practice, mock exams, revision). Aim for 40% or more.</span></p></section>`}

function renderPlanner(){
  const cfg=getCfg(),d=getDay(pDate),items=planItems(pDate),isT=pDate===today(),nm=isT?nowMin():-1;
  const pl=plannedMins(items),dn=plannedMins(items,true),pr=PRAY.filter(n=>d.pr[n]).length;
  const dt=new Date(pDate+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  let h=`<div class="syl pln"><div class="wk-head"><button class="icon" data-pa="prev" aria-label="Previous day">‹</button><div><b>${dt}</b><small>${isT?'Today':daysBetween(today(),pDate)>0?'In '+daysBetween(today(),pDate)+' day(s)':Math.abs(daysBetween(today(),pDate))+' day(s) ago'}</small></div><button class="icon" data-pa="next" aria-label="Next day">›</button>${isT?'':'<button class="btn" data-pa="now">Today</button>'}</div>`;

  const pct=cfg.goal?Math.min(100,Math.round(dn/(cfg.goal*60)*100)):0;
  h+=`<section class="card plsum"><div class="plsum-g"><div><span>Studied</span><b>${DUR(dn)}</b><small>of ${DUR(pl)} planned</small></div><button class="tgt" data-pa="tgt" aria-label="Edit daily target"><span>Target</span><b>${cfg.goal}h</b><small>${pct}% reached ✎</small></button><div><span>Prayers</span><b>${pr}/5</b><small>${pr===5?'All done':5-pr+' left'}</small></div></div><div class="bar plbar"><i style="width:${pct}%"></i></div></section>`;
  h+=`<section class="card"><h2>Prayers<span>tap when prayed<button class="gear" data-pa="set" aria-label="Prayer times" title="Prayer times"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></span></h2><div class="prs">`+PRAY.map(n=>`<button class="pr${d.pr[n]?' on':''}" data-pa="pray" data-n="${n}" aria-pressed="${!!d.pr[n]}"><span class="pc">${d.pr[n]?'✓':''}</span><b>${PNAME[n]}</b><small>${T12(cfg.pt[n]).replace(' ','')}</small></button>`).join('')+`</div></section>`;
  const nb=items.filter(x=>x.k==='b').length;
  h+=`<div class="sch-h"><div><h2 class="plain">Schedule</h2><small>${nb?nb+' block'+(nb===1?'':'s')+' · '+DUR(pl)+' planned':'Nothing planned yet'}</small></div><div class="sch-act"><button class="btn ai" data-pa="ai"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg> AI plan</button><button class="btn primary2" data-pa="add">+ Add block</button></div></div>`;
  h+=`<div class="qadd" role="group" aria-label="Quick add">`+QUICK.map(k=>`<button style="--h:${BT[k].h}" data-pa="qadd" data-v="${k}"><i></i>${BT[k].n}</button>`).join('')+`</div>`+(nb?mixHtml(items):'')+'<div class="tl">';
  let prevEnd=null,shown=0;
  items.forEach(x=>{
    prevEnd=Math.max(prevEnd??0,x.s+x.d);
    if(x.k==='p')return;shown++;
    const now=nm>=x.s&&nm<x.s+x.d,done=!!x.x,work=WORK.includes(x.t),neutral=!work;
    const run=FT&&FT.id===x.id&&FT.date===pDate;
    h+=`<div class="tl-row${done?' done':''}${now?' now':''}${neutral?' neu':''}${run?' run':''}" style="--h:${BT[x.t].h}"><div class="tl-time"><b>${T12(x.s).replace(' ','')}</b><small>${DUR(x.d)}</small></div><i class="tl-bar"></i>
    <button class="tl-body" data-pa="edit" data-id="${x.id}"><b>${esc(x.n||BT[x.t].n)}</b><small><span class="tg2">${BT[x.t].n}</span>${TECH[x.t]}${now?' · <em>Now</em>':''}</small></button>
    ${work&&!done?`<button class="tl-play" data-pa="focus" data-id="${x.id}" aria-label="Start focus timer">▶</button>`:'<span></span>'}

  h+='</div>';
  return h}

function openPSheet(html){$('#pcard').innerHTML=html;$('#psheet').hidden=false}

function openBlock(id,start,type){
  const d=getDay(pDate),b=id?d.b.find(x=>x.id===id):null;
  pEdit=id||'new';const t=b?b.t:(type||'study'),s=b?b.s:(start??nextStart(pDate)),dur=b?b.d:(DDUR[t]||60);

/* ===== AI day planner (Gemini via Firebase AI Logic) ===== */
const AI_TYPES=['class','study','revise','practice','exam','news','vocab','other'];
const AI_EX=['Class 3 to 5 PM. Polity and math in the morning, a mock exam in the evening.','Light day: 6 hours, newspaper, vocabulary and one revision block.','Focus on English and GK today. I start at 8 AM. 8 hours total.'];
let aiBusy=false,aiRes=null,aiText='',aiKeep=true,aiAI=null;
const aiCfg=()=>Object.assign({version:'13.1.0',models:['gemini-3.5-flash','gemini-2.5-flash']},window.AI_CONFIG||{});
function aiForm(msg){
  return `<div class="sheet-h"><b>AI plan</b><button class="btn" data-pa="close">Close</button></div>
  <p class="hint">Describe your day in your own words. It plans <b>${esc(new Date(pDate+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}))}</b> around your prayer times, target and revision due. You review it before anything is saved.</p>
  <label class="fld"><span>Your instruction</span><textarea id="ai-in" rows="4" maxlength="800" placeholder="e.g. Class 3 to 5 PM. Polity and math first, mock exam in the evening.">${esc(aiText)}</textarea></label>
  <div class="dchips">${AI_EX.map((x,i)=>`<button type="button" data-pa="aiex" data-i="${i}">${esc(x.length>34?x.slice(0,32)+'…':x)}</button>`).join('')}</div>
  <label class="chk"><input id="ai-keep" type="checkbox" ${aiKeep?'checked':''}> Keep my existing blocks and plan around them</label>
  ${msg?`<p class="aierr">${esc(msg)}</p>`:''}
  <div class="plact"><button class="btn primary2" data-pa="aigo" ${aiBusy?'disabled':''}>${aiBusy?'Planning…':'Generate plan'}</button></div>`}
function aiPreview(){
  const r=aiRes;
  return `<div class="sheet-h"><b>Review plan</b><button class="btn" data-pa="close">Close</button></div>
  ${r.note?`<p class="ptip">${esc(r.note)}</p>`:''}
  <div class="aiw">${r.blocks.map(b=>`<div class="airow" style="--h:${BT[b.t].h}"><b>${T12(b.s).replace(' ','')}</b><span>${DUR(b.d)}</span><div><strong>${esc(b.n)}</strong><small>${BT[b.t].n}</small></div></div>`).join('')}</div>
  <p class="hint">${r.blocks.length} blocks · ${DUR(r.blocks.filter(b=>WORK.includes(b.t)).reduce((a,b)=>a+b.d,0))} of study${r.adj?' · '+r.adj+' adjusted around prayers or overlaps':''}</p>
  <div class="plact"><button class="btn primary2" data-pa="aiapply">Apply to schedule</button><button class="btn" data-pa="aiback">Edit instruction</button></div>`}
function aiBuildPrompt(text,keep){
  const cfg=getCfg(),d=getDay(pDate),isT=pDate===today();
  const lec=plannedIds().map(id=>LECBY[id]).filter(l=>l&&!S.w[l.i]).slice(0,8).map(l=>l.l);
  const ctx={date:pDate,nowTime:isT?T24(Math.ceil(nowMin()/5)*5):null,studyTargetHours:cfg.goal,
    prayers:PRAY.map(n=>({name:PNAME[n],start:T24(cfg.pt[n]),minutes:PDUR[n]})),
    topicsDueForRevision:dueList().length,lecturesPlannedThisWeekNotYetWatched:lec,
    existingBlocks:keep?d.b.map(x=>({type:x.t,title:x.n,start:T24(x.s),minutes:x.d,done:!!x.x})):[]};
  return 'Student request:\n"""'+text+'"""\n\nContext (JSON):\n'+JSON.stringify(ctx)}
const AI_SYS=`You are a study-planning assistant for a university graduate preparing for a competitive government job exam (BCS). Turn the student's request into a one-day schedule of blocks.
Rules:
- Obey the student's instructions first (fixed class times, subjects, hours, wake time).
- Use only these block types: class (class lecture), study (deep study of new material), revise (spaced revision), practice (question practice), exam (timed mock exam), news (newspaper and current affairs), vocab (new words and meanings), other.
- Default total study time is studyTargetHours unless the request says otherwise. If nowTime is given, plan only after it.
- Put the hardest new learning first when attention is highest. Deep-study blocks 60 to 90 minutes, practice and exam 45 to 90, news 30 to 45, vocab 15 to 25, revise 30 to 60. Put light tasks (news, vocab) after heavy ones. Aim for about 35% revise or practice or exam.
- Never schedule over a prayer window (prayer start plus its minutes) or over existingBlocks. Do not create meal or break blocks. Leave natural free gaps of 10 to 20 minutes between blocks.
- Times are 24-hour HH:MM between 05:00 and 23:00, minutes are multiples of 5. Give each block a short specific title (use the lecture names given when relevant, or the subject the student named).
- "note": one or two short sentences explaining the logic of the plan.
Return JSON only.`;
async function aiGetModel(name,Schema,getAI,getGenerativeModel,GoogleAIBackend,app){
  const schema=Schema.object({properties:{note:Schema.string(),blocks:Schema.array({items:Schema.object({properties:{type:Schema.string(),title:Schema.string(),start:Schema.string(),minutes:Schema.number()}})})}});
  const ai=getAI(app,{backend:new GoogleAIBackend()});
  return getGenerativeModel(ai,{model:name,systemInstruction:AI_SYS,generationConfig:{responseMimeType:'application/json',responseSchema:schema,temperature:0.4}})}
function aiErr(e){
  const m=String(e&&e.message||e);
  if(/quota|429|rate|exhaust/i.test(m))return 'The free AI limit is used up for now. Try again later or add the blocks manually.';
  if(/403|permission|api key|not enabled|has not been used|disabled|API_KEY|forbidden/i.test(m))return 'AI Logic is not enabled for this Firebase project yet. In the Firebase console open AI Logic, press Get started and choose the Gemini Developer API.';
  if(/network|fetch|failed to load|import|Load failed/i.test(m))return 'Could not reach Gemini. Check your connection and try again.';
  if(/timeout/i.test(m))return 'The AI took too long. Try again.';
  return 'AI could not plan this: '+m.slice(0,140)}
async function aiRun(text,keep){
  if(!window.FIREBASE_CONFIG)throw new Error('API key not valid: firebase-config.js is missing');
  const C=aiCfg(),B='https://www.gstatic.com/firebasejs/'+C.version+'/';
  if(!aiAI){const [A,L]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-ai.js')]);
    const app=A.getApps().find(a=>a.name==='ai-plan')||A.initializeApp(window.FIREBASE_CONFIG,'ai-plan');aiAI={A,L,app}}
  let pref=null;try{pref=localStorage.getItem('st-ai-model')}catch(e){}
  const list=(pref?[pref]:[]).concat(C.models.filter(x=>x!==pref));let last=null;
  for(const name of list){
    try{
      const m=await aiGetModel(name,aiAI.L.Schema,aiAI.L.getAI,aiAI.L.getGenerativeModel,aiAI.L.GoogleAIBackend,aiAI.app);
      const res=await Promise.race([m.generateContent(aiBuildPrompt(text,keep)),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),45000))]);
      try{localStorage.setItem('st-ai-model',name)}catch(e){}
      return res.response.text()}
    catch(e){last=e;if(!/404|not found|not supported|unsupported|model/i.test(String(e&&e.message)))throw e}}
  throw last||new Error('No model available')}
function aiFit(raw,keep){
  let j;try{j=JSON.parse(String(raw).replace(/^```(?:json)?|```$/g,'').trim())}catch(e){throw new Error('The AI reply was not valid JSON')}
  const cfg=getCfg(),d=getDay(pDate);
  const fixed=PRAY.map(n=>({s:cfg.pt[n],e:cfg.pt[n]+PDUR[n]})).concat(d.b.filter(x=>keep||x.x).map(x=>({s:x.s,e:x.s+x.d})));
  const list=(Array.isArray(j.blocks)?j.blocks:[]).map(b=>({t:AI_TYPES.includes(b.type)?b.type:null,n:String(b.title||'').trim().slice(0,80),s:P24(String(b.start||'')),d:Math.round((+b.minutes||0)/5)*5})).filter(b=>b.t&&b.s!==null&&b.d>=15).sort((a,b)=>a.s-b.s);
  const placed=[];let adj=0;
  for(const b0 of list){
    let s0=b0.s,dd=Math.min(b0.d,240),moved=false;
    for(let k=0;k<12;k++){
      const hit=fixed.concat(placed).find(f=>s0<f.e&&s0+dd>f.s);if(!hit)break;moved=true;
      if(s0<hit.s&&hit.s-s0>=30)dd=Math.floor((hit.s-s0)/5)*5;else s0=hit.e}
    s0=Math.max(300,s0);
    if(s0+dd>1410||dd<15)continue;
    if(moved||s0!==b0.s||dd!==b0.d)adj++;
    placed.push({s:s0,e:s0+dd,id:uid(),t:b0.t,n:b0.n||BT[b0.t].n,d:dd,x:0})}
  placed.sort((a,b)=>a.s-b.s);
  if(!placed.length)throw new Error('The AI returned no usable blocks. Try rewording your instruction.');
  return {blocks:placed.map(({s,t,n,d,id,x})=>({id,t,n,s,d,x})),note:String(j.note||'').slice(0,240),adj}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa,d=getDay(pDate);
  if(a==='prev'){pDate=addDays(pDate,-1);render()}
  else if(a==='next'){pDate=addDays(pDate,1);render()}
  else if(a==='now'){pDate=today();render()}
  else if(a==='pray'){const n=b.dataset.n;if(d.pr[n])delete d.pr[n];else d.pr[n]=1;putDay(pDate,d)}
  else if(a==='done'){const x=d.b.find(z=>z.id===b.dataset.id);if(x){x.x=x.x?0:1;putDay(pDate,d)}}
  else if(a==='add')openBlock(null,b.dataset.s!=null?+b.dataset.s:undefined);
  else if(a==='ai'){aiRes=null;aiBusy=false;openPSheet(aiForm())}
  else if(a==='aiex'){const t=$('#ai-in');t.value=AI_EX[+b.dataset.i];t.focus()}
  else if(a==='aiback'){openPSheet(aiForm())}
  else if(a==='aigo'){
    if(aiBusy)return;const t=$('#ai-in').value.trim();aiKeep=$('#ai-keep').checked;
    if(t.length<8){$('#ai-in').focus();toast('Describe your day in a sentence or two');return}
    aiText=t;aiBusy=true;openPSheet(aiForm());
    aiRun(t,aiKeep).then(raw=>{aiRes=aiFit(raw,aiKeep);aiBusy=false;if(!$('#psheet').hidden)openPSheet(aiPreview())})
      .catch(e=>{aiBusy=false;if(!$('#psheet').hidden)openPSheet(aiForm(aiErr(e)))})}
  else if(a==='aiapply'){if(!aiRes)return;const dd=getDay(pDate);if(!aiKeep)dd.b=dd.b.filter(x=>x.x);dd.b=dd.b.concat(aiRes.blocks);aiRes=null;closePSheet();putDay(pDate,dd);toast('Plan added to your schedule')}
  else if(a==='qadd')openBlock(null,undefined,b.dataset.v);
  else if(a==='ptype'){const v=b.dataset.v;$('#pf-t').value=v;document.querySelectorAll('#pf-tc button').forEach(x=>x.classList.toggle('on',x===b));$('#pf-tip').textContent=TIPS[v]||'';if(pEdit==='new')$('#pf-d').value=DDUR[v]||60}
  else if(a==='pdur'){$('#pf-d').value=b.dataset.v}
  else if(a==='edit')openBlock(b.dataset.id);
  else if(a==='set')openSettings();
  else if(a==='close')closePSheet();
  else if(a==='focus')startFocus(pDate,b.dataset.id);
  else if(a==='fpause'){if(FT){if(FT.paused){FT.end=Date.now()+FT.left;FT.paused=0}else{FT.left=ftLeft();FT.paused=1}saveFT();render()}}
  else if(a==='ffin')finishFocus(false);
  else if(a==='fstop'){FT=null;saveFT();render()}
  else if(a==='save'){
    const s=P24($('#pf-s').value),du=Math.max(5,Math.min(480,+$('#pf-d').value||60)),t=$('#pf-t').value;
    if(s===null){toast('Pick a start time');return}
    const cf=getCfg(),hit=PRAY.find(n=>s<cf.pt[n]+PDUR[n]&&s+du>cf.pt[n]);
    if(hit&&!confirm('This block overlaps '+PNAME[hit]+' prayer time. Save anyway?'))return
    const o={id:pEdit==='new'?uid():pEdit,t,n:$('#pf-n').value.trim()||BT[t].n,s,d:Math.min(du,1440-s),x:0};
    if(pEdit==='new')d.b.push(o);else{const i=d.b.findIndex(z=>z.id===pEdit);if(i>=0){o.x=d.b[i].x;d.b[i]=o}}
    closePSheet();putDay(pDate,d)}
  else if(a==='del'){d.b=d.b.filter(z=>z.id!==pEdit);closePSheet();putDay(pDate,d)}
  else if(a==='setsave'){saveSettings();closePSheet();render();toast('Prayer times saved')}
  else if(a==='setreset'){S.c=Object.assign({},S.c||{},{pt:Object.assign({},PDEF)});commit();closePSheet();render();toast('Prayer times reset')}
  else if(a==='tgt')openTarget();
  else if(a==='tgtv'){$('#pt-goal').value=b.dataset.v}
  else if(a==='tgtsave'){const g=+$('#pt-goal').value;S.c=Object.assign({},S.c||{},{goal:isFinite(g)&&g>0?Math.max(1,Math.min(14,g)):10});commit();closePSheet();render()}
  else if(a==='clear'){if(confirm('Clear all blocks and prayer marks for this day?')){closePSheet();d.b=[];d.pr={};putDay(pDate,d)}}
});

const TAGS=["Consistency beats intensity.","Recall it, don't just reread it.","Revise today, remember tomorrow.","Start with the hardest topic.","One focused hour beats three distracted.","Sleep is part of studying.","Test yourself before the exam does.","Progress, not perfection.","Small daily gains add up.","Understand first, memorise second.","Practice questions teach what notes can't.","Plan the day, then follow the plan.","Mistakes show you what to fix.","Phone away, timer on.","Spaced revision beats last-night cramming.","Done is better than perfect.","Write answers out; speed comes with practice.","Rest well, return sharper.","Every topic finished is one less to fear.","Show up today, even for 30 minutes."];
{const el=document.getElementById('tagline');if(el){const n=Math.floor(Date.now()/864e5-(new Date().getTimezoneOffset()/1440));el.textContent=TAGS[((n%TAGS.length)+TAGS.length)%TAGS.length]}}

window.__bcs={t:()=>S.t,remote:r=>{const b=S.t;adopt(r);if(S.t!==b){try{localStorage.setItem(KEY,JSON.stringify({v:3,...S}))}catch(e){}render()}},push:()=>{dirty=true;flush()},setRef:r=>{ref=r}};

<script type="module">
// Firebase sync: Google sign-in + one Firestore document per user (users/<uid>).
const btn=document.getElementById('acct');
const cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey&&!String(cfg.apiKey).startsWith('PASTE')){
  const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
  try{
    const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=initializeApp(cfg),auth=A.getAuth(app);
    const db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()});
    let unsub=null;
    const menu=document.createElement('div');menu.className='amenu';menu.hidden=true;document.body.appendChild(menu);
    const ini=u=>((u.displayName||u.email||'?').trim()[0]||'?').toUpperCase();
    const avatar=u=>u.photoURL?`<img src="${u.photoURL}" alt="" referrerpolicy="no-referrer">`:ini(u);
    const esc2=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const USER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.9-3.6 3.9-5.4 7.5-5.4s6.6 1.8 7.5 5.4"/></svg>';
    const paint=(user,off)=>{
      btn.hidden=false;btn.classList.toggle('off',!!off);btn.classList.toggle('in',!!user);
      btn.innerHTML=user?`<span class="av">${avatar(user)}</span><span class="dot2"></span>`:USER+'Sign in';
      btn.title=user?(user.displayName||user.email||'Account'):'Sign in with Google to sync';
      btn.setAttribute('aria-label',user?'Account menu':'Sign in with Google');
      menu.innerHTML=user?`<div class="who"><span class="av">${avatar(user)}</span><div style="min-width:0"><b>${esc2(user.displayName||'Signed in')}</b><small>${esc2(user.email)}</small></div></div><div class="sync${off?' off':''}"><i></i>${off?'Offline. Changes sync when you reconnect.':'Synced across your devices'}</div><button class="out" type="button" id="signout">Sign out</button>`:'';
      const so=menu.querySelector('#signout');if(so)so.onclick=()=>{menu.hidden=true;A.signOut(auth)};
      if(!user)menu.hidden=true;
    };
    document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!btn.contains(e.target))menu.hidden=true});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')menu.hidden=true});
    btn.onclick=async()=>{
      if(auth.currentUser){menu.hidden=!menu.hidden;return}
      const p=new A.GoogleAuthProvider();
      try{await A.signInWithPopup(auth,p)}catch(e){
        if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))A.signInWithRedirect(auth,p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('Sign-in failed: '+(e.code||e.message))}
    };
    A.onAuthStateChanged(auth,user=>{
      if(unsub){unsub();unsub=null}
      window.__bcs.setRef(null);paint(user,false);
      if(!user)return;
      const ref=F.doc(db,'users',user.uid);
      window.__bcs.setRef({set:d=>F.setDoc(ref,d)});
      unsub=F.onSnapshot(ref,snap=>{
        paint(user,snap.metadata.fromCache&&!snap.metadata.hasPendingWrites&&!navigator.onLine);
        if(snap.metadata.hasPendingWrites)return;
        const mine=window.__bcs.t();
        if(snap.exists()){const r=snap.data();if((r.t||0)>mine)window.__bcs.remote(r);else if((r.t||0)<mine)window.__bcs.push()}
        else if(mine)window.__bcs.push();
      },()=>paint(user,true));
    });
    addEventListener('online',()=>auth.currentUser&&paint(auth.currentUser,false));
    addEventListener('offline',()=>auth.currentUser&&paint(auth.currentUser,true));
  }catch(e){console.warn('Sync unavailable',e)}
}
